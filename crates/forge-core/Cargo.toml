[package]
name = "forge-core"
version = "0.0.0"
description = "ECS core (Ch.5): error contract, Profile, EntityId, World, regions, the regionized scheduler"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Ch.1.1: forge-core sits on forge-seed and forge-frames (and through them forge-num).
[dependencies]
forge-num = { path = "../forge-num" }
forge-frames = { path = "../forge-frames" }
forge-seed = { path = "../forge-seed" }
bevy_ecs.workspace = true
# Ch.6: `EntityId` is reflectable (opaque) so `#[forge_api]` items can take and hold it.
bevy_reflect.workspace = true
smallvec.workspace = true

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
# W2 positive control for tests/test_region_disjointness.rs: `split` leaves the moved
# entities in the source region too (a bookkeeping bug that makes two regions overlap).
# The disjointness property test MUST FAIL in this build; see
# `positive_control_mutate_disjointness_build_fails`. Never enable it anywhere else.
mutate-disjointness = []

[lints]
workspace = true
