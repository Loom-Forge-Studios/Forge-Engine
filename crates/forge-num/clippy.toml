# Ch.1.2: `unwrap` is denied crate-wide except inside tests.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# forge-num must not reach the platform's transcendentals (Ch.3.1 failure mode 3, Ch.1.1).
# Clippy reads the clippy.toml nearest the crate, so the two settings above are repeated
# from the workspace root. Intentional comparisons against std (the benchmark, the
# accuracy table) opt out with `#[allow(clippy::disallowed_methods)]` at the call site.
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm is not bit-reproducible; use forge_num::det::sin" },
    { path = "f64::cos", reason = "platform libm is not bit-reproducible; use forge_num::det::cos" },
    { path = "f64::tan", reason = "platform libm is not bit-reproducible" },
    { path = "f64::sin_cos", reason = "platform libm is not bit-reproducible" },
    { path = "f64::asin", reason = "platform libm is not bit-reproducible" },
    { path = "f64::acos", reason = "platform libm is not bit-reproducible" },
    { path = "f64::atan", reason = "platform libm is not bit-reproducible; use forge_num::det::atan2" },
    { path = "f64::atan2", reason = "platform libm is not bit-reproducible; use forge_num::det::atan2" },
    { path = "f64::exp", reason = "platform libm is not bit-reproducible; use forge_num::det::exp" },
    { path = "f64::exp2", reason = "platform libm is not bit-reproducible" },
    { path = "f64::exp_m1", reason = "platform libm is not bit-reproducible" },
    { path = "f64::ln", reason = "platform libm is not bit-reproducible; use forge_num::det::ln" },
    { path = "f64::log", reason = "platform libm is not bit-reproducible" },
    { path = "f64::log2", reason = "platform libm is not bit-reproducible" },
    { path = "f64::log10", reason = "platform libm is not bit-reproducible" },
    { path = "f64::ln_1p", reason = "platform libm is not bit-reproducible" },
    { path = "f64::powf", reason = "platform libm is not bit-reproducible; use forge_num::det::pow" },
    { path = "f64::powi", reason = "the evaluation order of powi is unspecified; use forge_num::det::pow" },
    { path = "f64::sinh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cosh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::tanh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::asinh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::acosh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::atanh", reason = "platform libm is not bit-reproducible" },
    { path = "f64::hypot", reason = "platform libm is not bit-reproducible" },
    { path = "f64::cbrt", reason = "platform libm is not bit-reproducible" },
    { path = "f64::mul_add", reason = "Ch.3.3: forge-num uses no FMA (a software fma on a CPU without one is correct but slow); Dekker products instead" },
]
