[package]
name = "forge-asset"
version = "0.0.0"
description = "Asset system (Ch.8): stable AssetIds, content-addressed artefacts on forge-store blobs, a VFS over ProjectStore, importer/exporter/asset-type extension points, typed async handles, hot reload, thumbnails"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# forge-asset reaches storage only through forge-store's ProjectStore trait (I17): no std::fs
# here (guarded by tests/test_asset_store_only.rs). Importers, exporters and asset types are
# forge-plugin extension points; import/rename/remove are forge-cmd commands (I7). The
# first-party importers are a plugin (plugins/forge-importers, I16), not part of this crate.
[dependencies]
forge-core = { path = "../forge-core" }
forge-cmd = { path = "../forge-cmd" }
forge-plugin = { path = "../forge-plugin" }
forge-store = { path = "../forge-store" }
forge-seed = { path = "../forge-seed" }
# Deterministic pow for the sRGB tables: texture artefacts hash identically on every platform.
forge-num = { path = "../forge-num" }
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
blake3 = { version = "1.8.7", default-features = false, features = ["pure", "std"] }
bytes = "1.11"
# PNG encoding for the test-scene fixtures (`fixture`). Decoding is the importers' (plugin).
image = { version = "0.25.10", default-features = false, features = ["png"] }
# KTX2 container parsing (the texture artefact format; the writer is ktx2w.rs).
ktx2 = { version = "0.5", default-features = false, features = ["std"] }

[dev-dependencies]
# The glTF / image importers, loaded through the ordinary loader, for the import tests.
forge-importers = { path = "../../plugins/forge-importers" }
# test_gltf_roundtrip writes a data-URI glTF.
base64 = { version = "0.22", default-features = false, features = ["std"] }
# Timed tests run alone (forge_trace::timed::run_timed_alone; WP-19).
forge-trace = { path = "../forge-trace" }

[lints]
workspace = true
