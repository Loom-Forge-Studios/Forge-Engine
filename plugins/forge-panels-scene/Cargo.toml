[package]
name = "forge-panels-scene"
version = "0.0.0"
description = "First-party scene panels (Ch.21 §21.21): the scene hierarchy, the inspector generated from reflection, the viewport, the play controls and the brush tools. Registered through the ordinary EditorPanel point (I16); every project edit goes through the CommandEmitter (I7)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plugin on the editor's extension points: it sits on forge-editor (PanelCx, the emitter,
# the mirror, the services) and forge-ui (widgets), never on the core or the store.
[dependencies]
forge-editor = { path = "../../crates/forge-editor" }
forge-ui = { path = "../../crates/forge-ui", default-features = false }
forge-cmd = { path = "../../crates/forge-cmd" }
forge-plugin = { path = "../../crates/forge-plugin" }
forge-reflect = { path = "../../crates/forge-reflect" }
forge-seed = { path = "../../crates/forge-seed" }
# WP-U6: the viewport's camera and gizmos are f64 FramePos math; the canvas is a custom
# widget (taffy grid for the cells, AccessKit node label).
forge-frames = { path = "../../crates/forge-frames" }
taffy = "0.14"
accesskit = "0.25"

[features]
# W2 fault switches for the guards' positive controls (forge_trace::control_switches!, ADR 0046).
# Only [dev-dependencies] turn it on; a production build carries no control branch.
controls = ["forge-editor/controls"]

[dev-dependencies]
forge-panels-scene = { path = ".", features = ["controls"] }
forge-panels-core = { path = "../forge-panels-core" }
forge-core = { path = "../../crates/forge-core" }
serde_json.workspace = true

[lints]
workspace = true
