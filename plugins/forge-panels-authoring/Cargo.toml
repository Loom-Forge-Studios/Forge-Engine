[package]
name = "forge-panels-authoring"
version = "0.0.0"
description = "First-party authoring editors (Ch.21 §21.21): the sequencer and timeline (Ch.19 animate-any-property, curves, tracks, preview on the play core), the animation state machine, blend space and bone mask editor, and the localisation string-table editor with the pseudo-locale preview. Registered through the ordinary EditorPanel point (I16); every project edit goes through the CommandEmitter (I7)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plugin on the editor's extension points: forge-editor (PanelCx, the emitter, the mirror,
# the authoring models and backends) and forge-ui (widgets), never the core or the store.
[dependencies]
forge-editor = { path = "../../crates/forge-editor" }
forge-ui = { path = "../../crates/forge-ui", default-features = false }
forge-cmd = { path = "../../crates/forge-cmd" }
forge-plugin = { path = "../../crates/forge-plugin" }
accesskit = "0.25"
taffy = "0.14"

[features]
# W2 fault switches for the guards' positive controls (forge_trace::control_switches!, ADR 0046).
# Only [dev-dependencies] turn it on; a production build carries no control branch.
controls = ["forge-editor/controls"]

[dev-dependencies]
forge-panels-authoring = { path = ".", features = ["controls"] }
forge-panels-core = { path = "../forge-panels-core" }
forge-panels-scene = { path = "../forge-panels-scene" }

[lints]
workspace = true
