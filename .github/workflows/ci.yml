# Forge CI — the remote gate. Windows and Linux are co-primary (I18); macOS is out of scope
# (E-33, D-2). The steps between the `just verify` markers are EXACTLY the `verify` recipe in
# the justfile, in the same order; `cargo xtask gate-parity` fails if they drift (I12, W4).
# Setup (checkout, toolchain, tools, cache) goes before the markers and has no local twin.
name: ci

on:
  # Private repo (open core): dev is pushed after every merge, and hosted
  # Windows minutes bill double, so CI runs on main, on pull requests and on demand.
  # Every merge to dev is already gated locally by just verify + the Docker Linux leg.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Hosted runners have ~14 GB free; the whole workspace's test binaries with line
  # tables overran it on ubuntu-latest (rust-lld died with SIGBUS, 2026-09-27). CI only
  # needs pass/fail, so it builds without debug info. Local builds keep line tables.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    # Private repositories run Windows on a self-hosted GPU runner (label forge-gpu): hosted
    # runners have no GPU, so every GPU test there crawls through WARP at 2x billed minutes.
    # Public repositories and their forks never target a self-hosted runner; they use the hosted
    # windows-latest image. Linux stays hosted (lavapipe). The matrix names stay the co-primary
    # pair (I18).
    runs-on: ${{ matrix.os == 'windows-latest' && github.event.repository.private && fromJSON('["self-hosted", "windows", "forge-gpu"]') || matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Self-hosted Windows: the runner resolves `bash` on its own PATH, where System32's WSL
      # launcher comes first (the 2026-09-27 run failed with "execvpe(/bin/bash)"). GITHUB_PATH
      # entries are searched first for every later step. Setup, not a verify step: no local twin.
      - name: Git Bash ahead of WSL's bash (self-hosted Windows)
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin' -Encoding ascii
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      # The self-hosted runner already has these in ~/.cargo/bin (shared with the build lanes).
      - uses: taiki-e/install-action@v2
        if: runner.environment == 'github-hosted'
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-about
      # Hosted Linux runners ship ~14 GB free; the SDKs below are unused here. Setup, not a
      # verify step: it has no local twin.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # The ubuntu leg gets what the local Docker leg has (tools/docker/linux-verify/Dockerfile,
      # ADR 0044): lavapipe (with CI=true a GPU guard without an adapter fails), an X server
      # for the X11 clipboard and winit, and the emoji and CJK system fonts the text tests
      # draw. Setup, not a verify step: it has no local twin.
      - name: Linux test environment (lavapipe, Xvfb, fonts; libudev-dev for gilrs, WP-65)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb xauth libxkbcommon-x11-0 fonts-noto-color-emoji fonts-wqy-microhei libudev-dev
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # The ICD manifest name differs across Mesa releases (the 2026-09-27 run on Mesa 25.2
          # found no adapter at the hard-coded path): find it, prove it enumerates, fail fast.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then echo "no lavapipe ICD manifest"; ls -la /usr/share/vulkan/icd.d; exit 1; fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary | head -n 40
      # >>> just verify
      - name: fmt
        run: cargo xtask fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (forge-trace tracy feature, off by default)
        run: cargo clippy -p forge-trace --all-targets --features tracy --locked -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: doc tests
        run: cargo test --workspace --doc --locked
      - name: gate-parity (I12)
        run: cargo xtask gate-parity
      - name: plan-coverage
        run: cargo xtask plan-coverage
      - name: fp-rules (Ch.3.3)
        run: cargo xtask fp-rules
      - name: layering (host assembles plugins)
        run: cargo xtask layering
      - name: premium-boundary (open core, ADR 0059)
        run: cargo xtask premium-boundary
      - name: allocators (W8)
        run: cargo xtask allocators
      - name: gpu-turn (WP-19)
        run: cargo xtask gpu-turn
      - name: timed-gates (WP-40)
        run: cargo xtask timed-gates
      - name: gate
        run: cargo xtask gate
      - name: dod
        run: cargo xtask dod
      - name: licence-audit (I13)
        run: cargo xtask licence-audit
      # <<< just verify
