# cargo-about — NOTICES generation (Ch.38.5). `just verify` fails on a stale NOTICES;
# `just notices` regenerates it. Accepted licences must match deny.toml's permissive list
# (audited by `cargo xtask licence-audit`).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
]
# Both co-primary platforms, so NOTICES is byte-identical whichever OS generates it.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
